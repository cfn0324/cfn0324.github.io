---
layout: false
---
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8e3f0">
  <meta name="description" content="快快超人的个人主页。">
  <title>快快超人</title>
  <link rel="icon" href="/images/favicon-32x32-next.png" type="image/png">
  <link rel="stylesheet" href="/lib/font-awesome/css/all.min.css">
  <link rel="stylesheet" href="/css/profile.css">
</head>
<body class="profile-page">
  <main class="page-container">
    <div class="background-wrapper" aria-hidden="true">
      <img src="/images/profile-background.png" alt="" class="background-image background-placeholder">
      <img src="/images/profile-background.png" alt="" class="background-image background-main" id="background-main" fetchpriority="high">
      <div class="background-overlay"></div>
    </div>

    <div class="content-wrapper">
      <div class="avatar-container">
        <img src="/images/profile-avatar.png" alt="" class="avatar-image avatar-placeholder">
        <img src="/images/profile-avatar.png" alt="快快超人的头像" class="avatar-image avatar-main" id="avatar-main" fetchpriority="high">
      </div>

      <nav class="social-icons" aria-label="个人链接">
        <a href="https://github.com/cfn0324" target="_blank" rel="noopener noreferrer" class="social-link" style="--enter-delay: .8s" aria-label="GitHub" title="GitHub">
          <span class="icon-wrapper" aria-hidden="true">
            <i class="fab fa-github" aria-hidden="true"></i>
          </span>
          <span class="icon-shadow github-shadow" aria-hidden="true"></span>
        </a>

        <a href="/blog/" class="social-link blog-link" style="--enter-delay: .95s" aria-label="博客，进入文章列表" title="进入博客">
          <span class="icon-wrapper" aria-hidden="true">
            <i class="fas fa-book-open" aria-hidden="true"></i>
          </span>
          <span class="icon-shadow blog-shadow" aria-hidden="true"></span>
          <span class="blog-label">博客</span>
        </a>
      </nav>
    </div>

    <button class="quote-container" id="quote-container" type="button" aria-label="点击更换一句话">
      <span class="quote-text" id="quote-text" aria-live="polite"></span>
      <span class="quote-verse" id="quote-verse"></span>
    </button>
  </main>

  <script>
    (() => {
      const background = document.getElementById('background-main');
      const avatar = document.getElementById('avatar-main');
      const quoteText = document.getElementById('quote-text');
      const quoteVerse = document.getElementById('quote-verse');
      const quoteBox = document.getElementById('quote-container');
      const quotes = [
        ['把复杂的事想清楚，再把简单的事做好。', '快快超人'],
        ['行而不辍，未来可期。', '《荀子·修身》'],
        ['在代码与生活之间，记录每一次思考。', '快快超人']
      ];
      let quoteIndex = 0;
      let typingTimer;

      const reveal = (image) => {
        if (image && image.complete && image.naturalWidth > 0) image.classList.add('loaded');
      };
      [background, avatar].forEach((image) => {
        if (!image) return;
        image.addEventListener('load', () => reveal(image), { once: true });
        reveal(image);
      });

      function typeQuote(index) {
        window.clearTimeout(typingTimer);
        quoteText.textContent = '';
        quoteVerse.textContent = '';
        quoteVerse.classList.remove('visible');
        const [line, source] = quotes[index % quotes.length];
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          quoteText.textContent = `「 ${line} 」`;
          quoteVerse.textContent = `—— ${source}`;
          quoteVerse.classList.add('visible');
          return;
        }
        let cursor = 0;
        const tick = () => {
          quoteText.textContent = `「 ${line.slice(0, cursor)}${cursor < line.length ? '|' : ''} 」`;
          if (cursor < line.length) {
            cursor += 1;
            typingTimer = window.setTimeout(tick, 95 + Math.random() * 75);
          } else {
            typingTimer = window.setTimeout(() => {
              quoteText.textContent = `「 ${line} 」`;
              quoteVerse.textContent = `—— ${source}`;
              quoteVerse.classList.add('visible');
            }, 160);
          }
        };
        tick();
      }

      quoteBox.addEventListener('click', () => {
        quoteIndex = (quoteIndex + 1) % quotes.length;
        typeQuote(quoteIndex);
      });
      window.setTimeout(() => {
        quoteBox.classList.add('quote-visible');
        typeQuote(quoteIndex);
      }, 1500);
    })();
  </script>
</body>
</html>
